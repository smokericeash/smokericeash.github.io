<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <script>{% include theme-init.js %}</script>
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="Aidan Chen — Work" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/experience.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/ascent.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/experience.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/contact.js' | relative_url }}" defer></script>
</head>
<body data-baseurl="{{ site.baseurl }}">
  {% include header.html %}
  <main id="main" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
  {% include email-dialog.html %}
</body>
</html>
