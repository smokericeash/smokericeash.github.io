  result: Team-based defensive experience
  sections:
    - title: The objective
      text: Support assigned services while solving cybersecurity challenges under time pressure. I competed with the Cal Poly Pomona SWIFT team in March 2026.
    - title: My contribution
      text: I supported assigned SSH service administration and challenge-solving tasks, monitored service behavior, and coordinated with teammates as technical issues arose.
    - title: Lessons learned
      text: Networking, Linux, authentication, and troubleshooting fundamentals were useful throughout. Clear communication and an understanding of normal system behavior were essential to maintaining availability.
