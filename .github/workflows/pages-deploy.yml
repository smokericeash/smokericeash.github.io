name: Build, validate and deploy
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Production build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Verify preserved content, routes, links and metadata
        run: |
          bundle exec ruby tests/verify_site.rb
          bundle exec ruby tests/article_markup.rb
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _site &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          npm test
          node tests/worker-migration.cjs
          npm run test:performance
      - name: Upload review build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review
          path: |
            _site
            test-results
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    concurrency:
      group: pages-production
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
