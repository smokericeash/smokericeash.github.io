<div class="socials" aria-label="Professional profiles">{% for social in site.data.profile.socials %}{% if include.all or social.primary %}<a href="{% if social.url contains '://' or social.url contains 'mailto:' %}{{ social.url }}{% else %}{{ social.url | relative_url }}{% endif %}" {% if social.url contains 'mailto:' %}data-email-intent="message"{% endif %} {% if social.url contains '://' %}rel="me"{% endif %}>{% include icon.html name=social.icon %}<span>{{ social.label }}</span></a>{% endif %}{% endfor %}</div>
