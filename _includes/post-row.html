<article class="post-row" data-search="{{ include.post.title | append: ' ' | append: include.post.tags | append: ' ' | append: include.post.categories | downcase | escape }}" data-category="{{ include.post.categories | join: '|' | escape }}">
  <div class="post-date"><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%b %d, %Y' }}</time><span>{{ include.post.content | number_of_words | divided_by: 220 | plus: 1 }} min read</span></div>
  <div><p class="eyebrow">{{ include.post.categories | first }}</p><h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }} <span aria-hidden="true">↗</span></a></h3><p>{{ include.post.description | strip_html | normalize_whitespace | truncate: 170 }}</p></div>
</article>
