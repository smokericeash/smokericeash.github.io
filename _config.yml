title: Aidan Chen
tagline: Computer science and cybersecurity.
description: Aidan Chen's cybersecurity portfolio and technical journal. A computer science undergraduate at Cal Poly Pomona documenting security competitions, networking, and systems.
url: "https://smokericeash.github.io"
baseurl: ""
lang: en
timezone: America/Los_Angeles
author:
  name: Aidan Chen
  email: aidanchenn1@gmail.com
social:
  name: Aidan Chen
  links:
    - https://github.com/smokericeash
    - https://www.linkedin.com/in/aidan-chen-90926a300/
    - https://x.com/smokericeash
twitter:
  username: smokericeash
  card: summary_large_image
logo: /assets/social-preview.png
plugins: [jekyll-seo-tag, jekyll-sitemap]
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-preview.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false
exclude:
  [
    PROJECT_STATUS.md,
    docs,
    tools,
    tests,
    test-results,
    prototypes,
    node_modules,
    package.json,
    package-lock.json,
    Gemfile,
    Gemfile.lock,
    vendor,
    README.md,
    LICENSE,
    .devcontainer,
    .vscode,
    .npm-cache,
    .browser-cache,
    "*.log",
  ]
